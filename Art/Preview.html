<!doctype html>
<meta charset="utf-8">
<title>Dalmatians Renew — preview composition</title>
<style>
* { box-sizing: border-box; }
html, body, h1, p { margin:0; padding:0; }
body { width:896px; height:504px; overflow:hidden; position:relative; font-family:"Segoe UI",system-ui,sans-serif; }
.scene,.veil { position:absolute; inset:0; }
.scene { background: url('Preview.png') no-repeat 0 -195.6px / 896px 746.7px; }
.veil { background:radial-gradient(circle at top left, rgb(var(--veilRGB) / .86) 0%, rgb(var(--veilRGB) / 0) 74%); }
.plate { position:absolute; left:50px; top:54px; color:var(--inkPrimary); text-shadow:0 3px 10px rgb(0 0 0 / .75); }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; }
h1 span { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; background:var(--accent); margin:20px 0 16px; }
.summary { width:430px; font-size:21px; font-weight:400; line-height:1.45; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); font-size:26px; font-weight:700; line-height:1; color:var(--badgeInk); }
</style>
<div class="scene"></div><div class="veil"></div>
<div class="plate">
  <h1>Dalmatians <span>Renew</span></h1>
  <p class="tag">(unofficial)</p>
  <div class="rule"></div>
  <p class="summary">One dog, spotted and sweet-natured, brought forward.</p>
</div>
<div class="badge"></div><p class="version"></p>
<script>
// The renderer supplies palette JSON and the highest stable About.xml version.
window.preparePreview = async (palette, version) => {
  for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
  document.documentElement.style.setProperty('--veilRGB',palette.veil.match(/\w\w/g).map(x=>parseInt(x,16)).join(' '));
  document.querySelector('.version').textContent=version;
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode()));
};
</script>
